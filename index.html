  <!-- Telegram Mini App SDK: даёт initData (юзер + start_param) и openTelegramLink,
       когда страница открыта как Mini App внутри Telegram. Вне Telegram (обычный
       клик по ссылке в посеве) скрипт грузится, но initData пустой — тогда
       страница работает как обычная веб-прокладка (см. isMiniApp ниже). -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Meta Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    // Пиксель шлём ТОЛЬКО с боевого домена. На локалке и cloudflared/ngrok-
    // туннелях (тестирование прокладки) не инициализируем — иначе каждый
    // эфемерный *.trycloudflare.com попадает в Meta как отдельный мусорный
    // источник данных. Блоклист (а не allowlist), чтобы прод-домен —
    // github.io или будущий кастомный — всегда срабатывал. Пиксель нужен ради
    // cookie _fbp (ключ матчинга для Telegram-трафика, где fbclid нет) и
    // браузерного PageView-сигнала Meta.
    (function(){
      var h = location.hostname;
      var dev = h === 'localhost' || h === '127.0.0.1' || h === '' ||
                h.endsWith('.trycloudflare.com') || h.endsWith('.ngrok.io') ||
                h.endsWith('.ngrok-free.app') || h.endsWith('.local');
      if (!dev) {
        fbq('init', '1345428627003718');
        fbq('track', 'PageView');
      }
    })();
  </script>
  <!-- End Meta Pixel Code -->

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background:
        radial-gradient(120% 80% at 50% -10%, #17202e 0%, #0a0e17 55%, #070a11 100%);
      color: #e8edf6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100dvh; text-align: center; -webkit-font-smoothing: antialiased;
    }
    .wrap { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 24px; }
    .mark {
      font-weight: 800; letter-spacing: .28em; font-size: 20px;
      background: linear-gradient(90deg, #ff8a3c, #ff5722);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      padding-left: .28em; /* компенсация трекинга */
    }
    .sub { font-size: 14px; color: #8a95a8; letter-spacing: .01em; }

    /* ── Анимация: кольцо-спиннер → пламя → галочка (плавно, стиль Apple Pay) ──
       Всё на GPU (transform/opacity) + рисование SVG-обводки (stroke-dashoffset),
       по одному анимационному треку на элемент (без конфликтов), мягкие безье. */
    .scene { position: relative; width: 116px; height: 116px; }
    .scene::before {                       /* тёплое свечение под сценой */
      content: ""; position: absolute; inset: 8px; border-radius: 50%;
      background: radial-gradient(closest-side, rgba(255,122,51,.40), transparent 70%);
      filter: blur(7px); animation: glow 2.2s ease-in-out infinite;
    }
    .anim { position: relative; width: 100%; height: 100%; overflow: visible; }
    .anim .ring, .anim .success {
      transform-box: view-box; transform-origin: 60px 60px;
    }
    @keyframes glow { 0%,100% { opacity:.5; transform:scale(.9);} 50% { opacity:.95; transform:scale(1.06);} }

    /* Кольцо-спиннер: раскручивается и мягко тает, уступая галочке */
    .ring { animation: ringLife .9s cubic-bezier(.5,.1,.4,1) forwards; }
    @keyframes ringLife {
      0%   { opacity: 0; transform: rotate(0deg)   scale(.7); }
      16%  { opacity: 1; transform: rotate(80deg)  scale(1);  }
      70%  { opacity: 1; transform: rotate(520deg) scale(1);  }
      100% { opacity: 0; transform: rotate(600deg) scale(.55);}
    }
    /* Успех: круг рисуется, галочка дорисовывается, с лёгким «поп» */
    .success { opacity: 0; animation: succPop .5s cubic-bezier(.2,1.35,.35,1) .70s forwards; }
    @keyframes succPop {
      0%   { opacity: 0; transform: scale(.6); }
      60%  { opacity: 1; transform: scale(1.07); }
      100% { opacity: 1; transform: scale(1); }
    }
    .succ-ring  { stroke-dasharray: 189; stroke-dashoffset: 189; animation: draw .44s ease-out .76s forwards; }
    .succ-check { stroke-dasharray: 60;  stroke-dashoffset: 60;  animation: draw .30s ease-out 1.04s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    @media (prefers-reduced-motion: reduce) {   /* без движения — сразу готовая галочка */
      .scene::before, .ring { animation: none; opacity: 0; }
      .success { animation: none; opacity: 1; transform: none; }
      .succ-ring, .succ-check { animation: none; stroke-dashoffset: 0; }
    }
    /* Резервная ссылка, если авто-редирект по какой-то причине не сработал. */
    .manual { margin-top: 6px; font-size: 13px; }
    .manual a { color: #ff9a52; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">ПРОМЕТЕЙ</div>
    <div class="scene" aria-hidden="true">
      <svg class="anim" viewBox="0 0 120 120">
        <defs>
          <linearGradient id="fireGrad" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%"   stop-color="#ff3d00"/>
            <stop offset="55%"  stop-color="#ff8a3c"/>
            <stop offset="100%" stop-color="#ffd24d"/>
          </linearGradient>
        </defs>
        <circle class="ring" cx="60" cy="60" r="26" fill="none"
                stroke="url(#fireGrad)" stroke-width="5" stroke-linecap="round"
                stroke-dasharray="70 200"/>
        <g class="success">
          <circle class="succ-ring" cx="60" cy="60" r="30" fill="none"
                  stroke="url(#fireGrad)" stroke-width="5" stroke-linecap="round"
                  transform="rotate(-90 60 60)"/>
          <path class="succ-check" d="M45 61 l11 12 l24 -27" fill="none"
                stroke="url(#fireGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </svg>
    </div>
    <div class="sub">Открываем бота…</div>
    <noscript>
      <div class="sub">Нажмите, чтобы продолжить:</div>
      <div class="manual"><a href="https://t.me/PUMP_Prometheus_bot?start=src_tgads">Открыть бота</a></div>
    </noscript>
  </div>

  <!-- Meta Pixel <noscript> fallback -->
  <noscript>
    <img height="1" width="1" style="display:none"
         src="https://www.facebook.com/tr?id=1345428627003718&ev=PageView&noscript=1" />
  </noscript>

  <script>
  /* ─────────────────────────────────────────────────────────────────────────
     ПРОКЛАДКА ДЛЯ TELEGRAM ADS — «отскок» без контента.
     Ванильный порт логики prometey_landing/src/lib/fbAttribution.ts.

     Задача: за доли секунды собрать сигналы матчинга (fbp/IP/UA + fbc/src),
     сложить их в Cloudflare Worker «гардероб» под коротким токеном и сразу
     перебросить человека в бота по deep-link ?start=fbc_<token>. Бот по токену
     достанет данные (meta_capi.resolve_attribution) и будет слать Meta CAPI с
     хорошим match quality — сид для lookalike-аудитории.

     ВАЖНО про Telegram Ads: в таком трафике НЕТ ?fbclid (это Meta-click-id),
     значит fbc пустой. Worker /store требует fbc ИЛИ src, поэтому мы ВСЕГДА
     передаём src: из URL (?src=<code>) или дефолтный DEFAULT_SRC. Иначе запись
     не создастся и fbp/IP/UA не сохранятся.
     ───────────────────────────────────────────────────────────────────────── */
  (function () {
    var BOT         = "PUMP_Prometheus_bot";
    var WORKER_URL  = "https://prometheus-fbc.mihailingggggggg.workers.dev";
    var WRITE_KEY   = "prm_9f3Kx7Qa2Ld8Zt";      // тот же ключ, что и на основной прокладке (и так публичен)
    var STORAGE_KEY = "prometheus_fbc";           // сохранённый полный fbc (на случай возврата)
    var DEFAULT_SRC = "tgads";                    // разблокирует хранение для трафика без fbclid
    var SRC_RE      = /^[A-Za-z0-9]{1,32}$/;

    var FBP_WAIT_MS   = 1500;   // ждём, пока пиксель поставит cookie _fbp (асинхронно)
    var FBP_STEP_MS   = 150;
    var STORE_TIMEOUT = 2500;   // максимум на запрос к Worker /store
    var HARD_TIMEOUT  = 3500;   // общий предохранитель: не застреваем на лоадере

    // ── Режим: Mini App внутри Telegram vs обычная веб-страница (посев) ──────────
    // Telegram Ads не пускает внешние ссылки, поэтому боевой заход из рекламы — это
    // Direct Link Mini App (t.me/BOT/app?startapp=<код>): есть initData (юзер +
    // start_param), а уводим в бота через tg.openTelegramLink. Вне Telegram (клик по
    // ссылке в посеве) initData пуст — работаем как обычная веб-прокладка: ?src /
    // ?fbclid + window.location. Пиксель/сбор/токен/телеметрия — одинаковые в обоих.
    var tg = window.Telegram && window.Telegram.WebApp;
    var isMiniApp = !!(tg && tg.initData && tg.initData.length > 0);
    if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

    // ── Телеметрия воронки (см. Worker /track): enter (открыл) → redirect (ушёл в
    // бота) → error (сбой атрибуции, с причиной). sendBeacon не блокирует и
    // переживает уход со страницы, поэтому НИКОГДА не задерживает редирект.
    var trackSrc = "";          // код кампании (ставится ниже, из ?src или DEFAULT_SRC)
    var countThis = true;       // считать ли этот заход (не бот / не повторное открытие) — выставится ниже
    function beacon(event, reason) {
      try {
        if (!trackSrc || !countThis) return;   // боты и дубли не пишем — иначе воронка задваивается
        var payload = { src: trackSrc, event: event };
        if (reason) payload.reason = reason;
        var body = JSON.stringify(payload);
        var url = WORKER_URL + "/track";
        if (navigator.sendBeacon) {
          // text/plain — чтобы не было CORS-preflight (sendBeacon его не умеет).
          navigator.sendBeacon(url, new Blob([body], { type: "text/plain" }));
        } else {
          fetch(url, { method: "POST", body: body, keepalive: true }).catch(function () {});
        }
      } catch (e) {}
    }

    function readCookie(name) {
      var m = document.cookie.match(new RegExp("(?:^|;\\s*)" + name + "=([^;]+)"));
      return m ? decodeURIComponent(m[1]) : null;
    }
    function qs(name) {
      try { return new URLSearchParams(window.location.search).get(name); }
      catch (e) { return null; }
    }

    // Полный fbc (fb.1.<ts>.<fbclid>): cookie _fbc → из ?fbclid → localStorage.
    function resolveFbc() {
      var fbc = readCookie("_fbc");
      if (!fbc) {
        var fbclid = qs("fbclid");
        if (fbclid) fbc = "fb.1." + Date.now() + "." + fbclid;
      }
      if (fbc) {
        try { localStorage.setItem(STORAGE_KEY, fbc); } catch (e) {}
        return fbc;
      }
      try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
    }

    function readSrc() {
      // Mini App: код кампании прилетает в start_param (из ?startapp=<код>).
      if (isMiniApp) {
        var sp = tg.initDataUnsafe && tg.initDataUnsafe.start_param;
        return sp && SRC_RE.test(sp) ? sp : null;
      }
      var src = qs("src");
      return src && SRC_RE.test(src) ? src : null;
    }

    // Пиксель ставит _fbp асинхронно (fbevents.js грузится отдельно) — поллим.
    function waitForFbp() {
      return new Promise(function (resolve) {
        var started = Date.now();
        (function tick() {
          var fbp = readCookie("_fbp");
          if (fbp || Date.now() - started >= FBP_WAIT_MS) resolve(fbp);
          else setTimeout(tick, FBP_STEP_MS);
        })();
      });
    }

    // POST /store → { token }. Возвращает токен или null (тихий фолбэк).
    function storeAttribution(fbc, src) {
      if (!fbc && !src) return Promise.resolve(null);
      return waitForFbp().then(function (fbp) {
        var payload = { src: src };
        if (fbc) payload.fbc = fbc;
        if (fbp) payload.fbp = fbp;
        var ctrl = new AbortController();
        var timer = setTimeout(function () { ctrl.abort(); }, STORE_TIMEOUT);
        return fetch(WORKER_URL + "/store", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Write-Key": WRITE_KEY },
          body: JSON.stringify(payload),
          signal: ctrl.signal
        }).then(function (res) {
          clearTimeout(timer);
          if (!res.ok) { beacon("error", "store_" + res.status); return null; }
          return res.json();
        }).then(function (data) {
          return data && typeof data.token === "string" ? data.token : null;
        }).catch(function (e) {
          clearTimeout(timer);
          beacon("error", e && e.name === "AbortError" ? "timeout" : "network");
          return null;
        });
      });
    }

    var done = false;
    function go(startParam) {
      if (done) return;
      done = true;
      beacon("redirect");                          // ушёл в бота (sendBeacon переживёт уход)
      var url = "https://t.me/" + BOT + "?start=" + startParam;
      if (isMiniApp && tg.openTelegramLink) {
        // Внутри Telegram: нативно открываем чат бота (со стартом), закрываем апп.
        try { tg.openTelegramLink(url); } catch (e) { window.location.replace(url); }
        setTimeout(function () { try { tg.close(); } catch (e) {} }, 800);
      } else {
        window.location.replace(url);
      }
    }

    // Анимация лоадер→галочка длится ~1.35с. Редирект ждёт, пока анимация дойдёт
    // до галочки И данные готовы — так человек всегда видит её целиком. Обычно
    // данные готовятся дольше анимации; если быстрее — держим галочку. Жёсткие
    // предохранители ниже (go напрямую) не ждут анимацию — крайний случай.
    var ANIM_MS = 1400;
    var _animDone = false, _pending = null;
    setTimeout(function () { _animDone = true; _flush(); }, ANIM_MS);
    function finish(startParam) { _pending = startParam; _flush(); }
    function _flush() { if (_animDone && _pending !== null) go(_pending); }

    var fbc = resolveFbc();
    var src = readSrc();
    if (!fbc && !src) src = DEFAULT_SRC;          // гарантируем src → Worker сохранит fbp/IP/UA
    trackSrc = src;                               // телеметрия по коду кампании (или tgads)
    var fallback = "src_" + (src || "website");    // без токена хотя бы источник (fbp/ip не будет)

    // Считаем заход ТОЛЬКО для реального человека и один раз на браузер/код — иначе
    // публичная авто-редиректная страница на github.io накручивается JS-краулерами
    // (каждый со своим localStorage, поэтому дедуп их не ловит), а enter/redirect
    // улетают в разы. Признак этой накрутки: redirect есть, а в бот (started) 0.
    // Атрибуцию (store/miniapp/token) это НЕ трогает — гейт только на счётчики.
    function isBot() {
      try {
        if (navigator.webdriver) return true;
        var ua = (navigator.userAgent || "").toLowerCase();
        if (!ua) return true;
        return /bot|crawl|spider|slurp|preview|facebookexternalhit|telegrambot|headless|phantom|selenium|puppeteer|playwright|lighthouse|pingdom|uptime|monitor|scan|curl|wget|python|axios|go-http|java\//.test(ua);
      } catch (e) { return false; }
    }
    // Реальный посетитель: в Mini App — подписанный Telegram-юзер (краулер такое не
    // подделает, это надёжный сигнал ТГ-трафика); в вебе — не автоматизация, есть
    // языки браузера и вкладка видима (краулеры часто без языков / в фоне / headless).
    function humanVisitor() {
      if (isMiniApp) {
        return !!(tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id);
      }
      try {
        if (isBot()) return false;
        if (!(navigator.languages && navigator.languages.length)) return false;
        if (typeof document.visibilityState === "string" && document.visibilityState !== "visible") return false;
        return true;
      } catch (e) { return true; }
    }
    var VISIT_TTL = 6 * 60 * 60 * 1000;           // 6ч: то же открытие в том же браузере не пересчитываем
    function firstVisit(code) {
      try {
        var k = "prm_visit_" + code, now = Date.now();
        var prev = parseInt(localStorage.getItem(k) || "0", 10);
        if (prev && now - prev < VISIT_TTL) return false;
        localStorage.setItem(k, String(now));
        return true;
      } catch (e) { return true; }                // нет storage — не мешаем счёту
    }
    // Короткое условие: боты (humanVisitor=false) не занимают слот дедупа (firstVisit
    // не зовётся), поэтому реальный человек после бота всё равно посчитается.
    countThis = humanVisitor() && firstVisit(src);

    beacon("enter");                              // реальные заходы (боты/дубли отсеяны в countThis)

    // Mini App (реклама): спрашиваем право писать (для дожима недошедших) → кладём
    // открытие в Worker /miniapp (отдаёт token для хендофа) → уводим в бота.
    // Веб (посевы): обычный store + редирект, с предохранителем на зависание.
    function runMiniApp() {
      var user = tg.initDataUnsafe && tg.initDataUnsafe.user;
      var already = !!(user && user.allows_write_to_pm);   // право уже есть → окно не показываем
      // Бэкстоп: если callback так и не пришёл (редкий сбой клиента) — всё равно уводим.
      setTimeout(function () { go(fallback); }, 15000);
      function afterWA(granted) {
        waitForFbp().then(function (fbp) {
          var payload = { initData: tg.initData, src: src, wa: !!granted };
          if (fbp) payload.fbp = fbp;
          var ctrl = new AbortController();
          var timer = setTimeout(function () { ctrl.abort(); }, STORE_TIMEOUT);
          fetch(WORKER_URL + "/miniapp", {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-Write-Key": WRITE_KEY },
            body: JSON.stringify(payload),
            signal: ctrl.signal
          }).then(function (r) { clearTimeout(timer); return r.ok ? r.json() : null; })
            .then(function (d) { finish(d && d.token ? "fbc_" + d.token : fallback); })
            .catch(function (e) {
              clearTimeout(timer);
              beacon("error", e && e.name === "AbortError" ? "timeout" : "network");
              finish(fallback);
            });
        });
      }
      if (already) { afterWA(true); return; }
      if (tg.requestWriteAccess) {
        try { tg.requestWriteAccess(function (granted) { afterWA(!!granted); }); }
        catch (e) { afterWA(false); }
      } else { afterWA(false); }
    }

    if (isMiniApp) {
      runMiniApp();
    } else {
      setTimeout(function () { go(fallback); }, HARD_TIMEOUT);   // предохранитель веб-режима
      storeAttribution(fbc, src).then(function (token) {
        finish(token ? "fbc_" + token : fallback);
      }).catch(function () { finish(fallback); });
    }
  })();
  </script>
</body>
